<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Simulación de Crédito KSFM</title>
  <link rel="stylesheet" href="styless.css">
</head>
<body>

  <div class="container">
    <h1>Simulador de Crédito Personal KSFM</h1>
    
    <form id="credit-form">
      <div class="form-group full-width">
        <label for="nombre">Nombre Completo del Solicitante:</label>
        <input type="text" id="nombre" placeholder="Ej. Juan Pérez González" required>
      </div>

      <div class="form-group">
        <label for="monto">Monto del Crédito Solicitado ($):</label>
        <input type="number" id="monto" value="150000" min="1000" step="100" required>
      </div>

      <div class="form-group">
        <label for="tasa">Tasa de Interés Anual Ordinaria (%):</label>
        <input type="number" id="tasa" value="34" step="0.1" min="1" required>
      </div>

      <div class="form-group full-width">
        <label for="plazo">Plazo del Financiamiento (Meses):</label>
        <select id="plazo">
          <option value="12">12 meses</option>
          <option value="24">24 meses</option>
          <option value="36">36 meses</option>
          <option value="48" selected>48 meses</option>
        </select>
      </div>

      <button type="button" id="btn-calcular">Calcular Simulación</button>
    </form>
    <div id="resultado-container" class="resultado-container">
      <h2 id="titulo-amortizacion">Tabla de Amortización</h2>
      <div class="table-responsive">
        <table id="tabla-amortizacion">
          <thead>
            <tr>
              <th>No. Pago</th>
              <th>Amortización Capital</th>
              <th>Interés</th>
              <th>IVA Interés</th>
              <th>Pago Total Mensual</th>
              <th>Saldo Insoluto</th>
            </tr>
          </thead>
          <tbody>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
